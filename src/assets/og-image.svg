<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fuente de public/og.png. Para regenerarla: rsvg-convert -w 1200 -h 630 src/assets/og-image.svg -o public/og.png -->
  <defs>
    <radialGradient id="g1" cx="15%" cy="10%" r="60%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="95%" cy="95%" r="60%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#e8e8e6" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#111315"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <g font-family="Noto Sans, DejaVu Sans, sans-serif">
    <rect x="96" y="96" width="72" height="72" rx="14" fill="#0f766e"/>
    <text x="132" y="144" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">EA</text>

    <text x="96" y="300" font-size="88" font-weight="700" fill="#e8e8e6">Eloy Alonso</text>
    <text x="96" y="370" font-size="40" font-weight="600" fill="#2dd4bf">Full Stack Developer</text>
    <text x="96" y="430" font-size="30" fill="#9ca0a4">Laravel · PHP · REST APIs · MySQL</text>

    <circle cx="106" cy="527" r="8" fill="#4ade80"/>
    <text x="126" y="537" font-size="26" fill="#9ca0a4">Remote</text>
  </g>
</svg>
